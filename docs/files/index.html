<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Documents – greenserver.be</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='10' width='16' height='11' rx='2.5' fill='%23168232'/%3E%3Cpath d='M8 10V7a4 4 0 0 1 8 0v3' fill='none' stroke='%23168232' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
  :root {
    --fond: #f4f3ef;
    --carte: #ffffff;
    --texte: #1a1a19;
    --texte2: #52514e;
    --discret: #8a8985;
    --bord: #e4e2dc;
    --vert: #168232;
    --vert-survol: #116b28;
    --vert-texte: #ffffff;
    --ok-fond: #e6f3ea;
    --erreur-fond: #fbe9e7;
    --erreur-texte: #9b2318;
    --ombre: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #141413;
      --carte: #1e1e1d;
      --texte: #ecebe7;
      --texte2: #b6b4ae;
      --discret: #85837e;
      --bord: #31302d;
      --vert: #26a047;
      --vert-survol: #33b556;
      --ok-fond: #17291c;
      --erreur-fond: #3a1a16;
      --erreur-texte: #f4a59b;
      --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 16px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
  }
  [hidden] { display: none !important; }
  .page { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  .carte {
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 14px;
    box-shadow: var(--ombre);
    padding: 26px 28px;
  }
  .tete { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .tete svg { width: 40px; height: 40px; flex: none; color: var(--vert); }
  h1 { font-size: 24px; line-height: 1.2; margin: 0; }
  .sous-titre { margin: 2px 0 0; color: var(--texte2); font-size: 15px; }

  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .saisie { display: flex; gap: 10px; }
  input[type=password] {
    flex: 1; min-width: 0;
    font: inherit; color: var(--texte);
    background: var(--fond);
    border: 1px solid var(--bord);
    border-radius: 10px;
    padding: 11px 14px;
  }
  input[type=password]:focus { outline: 3px solid var(--vert); outline-offset: 1px; border-color: transparent; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 10px;
    background: var(--vert); color: var(--vert-texte);
    padding: 11px 22px;
    transition: background .15s;
  }
  button:hover { background: var(--vert-survol); }
  button:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: progress; }
  button.secondaire { background: transparent; color: var(--vert); box-shadow: inset 0 0 0 2px var(--vert); padding: 7px 14px; font-size: 14px; }
  button.secondaire:hover { background: var(--ok-fond); }

  .message { margin: 12px 0 0; min-height: 1.55em; color: var(--texte2); font-size: 15px; }
  .message.erreur { color: var(--erreur-texte); background: var(--erreur-fond); border-radius: 8px; padding: 8px 12px; }

  .barre { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .liste { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--bord); }
  .liste li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--bord); }
  .ext {
    flex: none; width: 46px; height: 46px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--ok-fond); color: var(--vert);
    font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  }
  .infos { flex: 1; min-width: 0; }
  .nom { font-weight: 600; overflow-wrap: anywhere; }
  .taille { color: var(--discret); font-size: 14px; }
  .actions { display: flex; gap: 8px; flex: none; }
  .vide { color: var(--texte2); margin: 14px 0 0; }
  .rubrique { display: flex; align-items: center; gap: 10px; font-size: 17px; margin: 26px 0 8px; }
  .rubrique svg { width: 22px; height: 22px; color: var(--vert); flex: none; }
  .rubrique .nb { color: var(--discret); font-weight: 400; font-size: 14px; }

  .pied { color: var(--discret); font-size: 13px; text-align: center; margin: 18px 0 0; }
  .pied a { color: var(--vert); font-weight: 600; text-underline-offset: 2px; }

  @media (max-width: 560px) {
    .page { padding: 24px 12px; }
    .carte { padding: 20px 16px; }
    .saisie { flex-direction: column; }
    .liste li { flex-wrap: wrap; }
    .actions { width: 100%; padding-left: 60px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="carte" id="ecran-verrou">
    <div class="tete">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      <div>
        <h1>Documents</h1>
        <p class="sous-titre" id="t-intro">These files are encrypted. Enter the password to open them.</p>
      </div>
    </div>
    <form id="formulaire" autocomplete="on">
      <input type="text" name="username" value="greenserver.be/files" autocomplete="username" hidden>
      <label for="mdp" id="t-mdp">Password</label>
      <div class="saisie">
        <input id="mdp" name="password" type="password" autocomplete="current-password" required autofocus>
        <button id="ouvrir" type="submit">Unlock</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="carte" id="ecran-liste" hidden>
    <div class="barre">
      <div>
        <h1>Documents</h1>
        <p class="sous-titre" id="maj"></p>
      </div>
      <button class="secondaire" id="verrouiller" type="button">Lock</button>
    </div>
    <div id="liste"></div>
  </section>

  <p class="pied"><span id="t-pied">Decryption happens in your browser. The password is never sent anywhere.</span> · <a id="langue" href="?lang=fr" hreflang="fr" lang="fr">Français</a></p>
</main>

<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const utf8 = new TextEncoder();
  const APERCU = /^(application\/pdf|image\/|text\/plain|audio\/|video\/)/;

  let cle = null;            // CryptoKey AES-GCM, gardée en mémoire seulement
  let documents = [];
  let majManifeste = "";
  const cache = new Map();   // id -> Blob déchiffré
  const urls = new Set();

  // ---- Langue : anglais par défaut, français si choisi (?lang=fr ou choix mémorisé) ----
  const TEXTES = {
    en: {
      intro: "These files are encrypted. Enter the password to open them.",
      mdp: "Password", ouvrir: "Unlock", verrouiller: "Lock",
      pied: "Decryption happens in your browser. The password is never sent anywhere.",
      autre: "Français", autreCode: "fr",
      open: "Open", download: "Download", erreur: "Error",
      aucun: "No documents yet.",
      doc: (n) => n + (n === 1 ? " document" : " documents"),
      dossiers: (n) => " in " + n + (n === 1 ? " folder" : " folders"),
      maj: (d) => " · updated " + d,
      unites: ["B", "KB", "MB", "GB"], decimale: ".",
      dechiffrement: (nom) => "Decrypting " + nom + "…",
      navigateur: "This browser cannot decrypt the files. Use an up-to-date browser over HTTPS.",
      verification: "Checking the password…",
      mauvais: "Wrong password.",
      rien: "No documents have been published here yet.",
      chargement: "The documents could not be loaded. Check your connection and try again.",
    },
    fr: {
      intro: "Ces fichiers sont chiffrés. Saisissez le mot de passe pour les ouvrir.",
      mdp: "Mot de passe", ouvrir: "Déverrouiller", verrouiller: "Verrouiller",
      pied: "Le déchiffrement se fait dans votre navigateur. Le mot de passe n'est jamais envoyé.",
      autre: "English", autreCode: "en",
      open: "Ouvrir", download: "Télécharger", erreur: "Erreur",
      aucun: "Aucun document pour l'instant.",
      doc: (n) => n + (n === 1 ? " document" : " documents"),
      dossiers: (n) => " dans " + n + (n === 1 ? " dossier" : " dossiers"),
      maj: (d) => {
        const date = new Date(d + "T12:00:00");
        const lisible = isNaN(date) ? d : date.toLocaleDateString("fr-BE", { day: "numeric", month: "long", year: "numeric" });
        return " · mis à jour le " + lisible;
      },
      unites: ["o", "Ko", "Mo", "Go"], decimale: ",",
      dechiffrement: (nom) => "Déchiffrement de " + nom + "…",
      navigateur: "Ce navigateur ne peut pas déchiffrer les fichiers. Utilisez un navigateur à jour, en HTTPS.",
      verification: "Vérification du mot de passe…",
      mauvais: "Mot de passe incorrect.",
      rien: "Aucun document n'a encore été publié ici.",
      chargement: "Impossible de charger les documents. Vérifiez votre connexion et réessayez.",
    },
  };

  function memoriserLangue(l) { try { localStorage.setItem("langue", l); } catch (e) {} }

  function langueInitiale() {
    const demandee = new URLSearchParams(location.search).get("lang");
    if (demandee === "fr" || demandee === "en") { memoriserLangue(demandee); return demandee; }
    try {
      const memo = localStorage.getItem("langue");
      if (memo === "fr" || memo === "en") return memo;
    } catch (e) {}
    return "en";
  }

  let langue = langueInitiale();
  let T = TEXTES[langue];

  function appliquerLangue() {
    T = TEXTES[langue];
    document.documentElement.lang = langue;
    $("t-intro").textContent = T.intro;
    $("t-mdp").textContent = T.mdp;
    $("ouvrir").textContent = T.ouvrir;
    $("verrouiller").textContent = T.verrouiller;
    $("t-pied").textContent = T.pied;
    const lien = $("langue");
    lien.textContent = T.autre;
    lien.lang = lien.hreflang = T.autreCode;
    lien.href = "?lang=" + T.autreCode;
    if (cle) afficherListe(majManifeste, false);   // liste déjà ouverte : on la réécrit
  }

  $("langue").addEventListener("click", (ev) => {
    ev.preventDefault();
    langue = T.autreCode;
    memoriserLangue(langue);
    history.replaceState(null, "", "?lang=" + langue);
    message("");
    appliquerLangue();
  });

  function base64(s) { return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }

  function taille(n) {
    const u = T.unites;
    if (n < 1024) return n + " " + u[0];
    let i = 0;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 1 : 0).replace(".", T.decimale) + " " + u[i];
  }

  async function charger(chemin) {
    const r = await fetch(chemin, { cache: "no-store" });
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r;
  }

  async function dechiffrer(octets, aad) {
    const clair = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: octets.subarray(0, 12), additionalData: utf8.encode(aad) },
      cle, octets.subarray(12));
    return new Uint8Array(clair);
  }

  function message(texte, erreur) {
    const m = $("message");
    m.textContent = texte;
    m.classList.toggle("erreur", !!erreur);
  }

  async function deverrouiller(mdp) {
    const coffre = await (await charger("vault.json")).json();
    const base = await crypto.subtle.importKey("raw", utf8.encode(mdp.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
    cle = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: base64(coffre.salt), iterations: coffre.iterations },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const brut = new Uint8Array(await (await charger("data/manifest.bin")).arrayBuffer());
    const manifeste = JSON.parse(new TextDecoder().decode(await dechiffrer(brut, "manifest")));
    documents = manifeste.files || [];
    majManifeste = manifeste.updated || "";
    afficherListe(majManifeste, true);
  }

  function extension(nom) {
    const i = nom.lastIndexOf(".");
    return i > 0 ? nom.slice(i + 1, i + 5) : "file";
  }

  const DOSSIER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="currentColor"/></svg>';

  function afficherListe(maj, focus) {
    const zone = $("liste");
    zone.replaceChildren();
    // Les documents à la racine d'abord, puis une rubrique par dossier, dans l'ordre du manifeste
    const groupes = new Map();
    for (const doc of documents) {
      const g = doc.folder || "";
      if (!groupes.has(g)) groupes.set(g, []);
      groupes.get(g).push(doc);
    }
    for (const [nomGroupe, docs] of groupes) {
      if (nomGroupe) {
        const h = document.createElement("h2");
        h.className = "rubrique";
        h.innerHTML = DOSSIER;
        h.append(document.createTextNode(nomGroupe));
        const nb = document.createElement("span");
        nb.className = "nb";
        nb.textContent = "· " + T.doc(docs.length);
        h.append(nb);
        zone.append(h);
      }
      const ul = document.createElement("ul");
      ul.className = "liste";
      remplirListe(ul, docs);
      zone.append(ul);
    }
    if (!documents.length) {
      const p = document.createElement("p"); p.className = "vide"; p.textContent = T.aucun;
      zone.append(p);
    }
    const nbDossiers = [...groupes.keys()].filter(Boolean).length;
    $("maj").textContent = T.doc(documents.length)
      + (nbDossiers ? T.dossiers(nbDossiers) : "")
      + (maj ? T.maj(maj) : "");
    $("ecran-verrou").hidden = true;
    $("ecran-liste").hidden = false;
    if (focus) $("verrouiller").focus();
  }

  function remplirListe(ul, docs) {
    for (const doc of docs) {
      const li = document.createElement("li");
      const ext = document.createElement("span");
      ext.className = "ext"; ext.textContent = extension(doc.name); ext.setAttribute("aria-hidden", "true");
      const infos = document.createElement("div");
      infos.className = "infos";
      const nom = document.createElement("div"); nom.className = "nom"; nom.textContent = doc.name;
      const t = document.createElement("div"); t.className = "taille"; t.textContent = taille(doc.size);
      infos.append(nom, t);
      const actions = document.createElement("div");
      actions.className = "actions";
      if (APERCU.test(doc.type)) actions.append(bouton(T.open, T.open + " " + doc.name, () => ouvrir(doc)));
      actions.append(bouton(T.download, T.download + " " + doc.name, () => telecharger(doc)));
      li.append(ext, infos, actions);
      ul.append(li);
    }
  }

  function bouton(texte, libelle, action) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "secondaire"; b.textContent = texte;
    b.setAttribute("aria-label", libelle);
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await action(); }
      catch (e) { alerteDiscrete(b, e); }
      finally { b.disabled = false; }
    });
    return b;
  }

  function alerteDiscrete(b, e) {
    console.error(e);
    const ancien = b.textContent;
    b.textContent = T.erreur;
    setTimeout(() => { b.textContent = ancien; }, 2500);
  }

  async function blobDe(doc) {
    if (cache.has(doc.id)) return cache.get(doc.id);
    const brut = new Uint8Array(await (await charger("data/" + doc.id + ".bin")).arrayBuffer());
    const clair = await dechiffrer(brut, doc.id);
    let type = doc.type;
    if (type.startsWith("text/") && !/charset=/i.test(type)) {
      // Sans charset, le navigateur affiche mal les accents : UTF-8 si valide, sinon Windows-1252.
      let utf8Valide = true;
      try { new TextDecoder("utf-8", { fatal: true }).decode(clair); } catch { utf8Valide = false; }
      type += utf8Valide ? ";charset=utf-8" : ";charset=windows-1252";
    }
    const blob = new Blob([clair], { type });
    cache.set(doc.id, blob);
    return blob;
  }

  function urlDe(blob) {
    const u = URL.createObjectURL(blob);
    urls.add(u);
    return u;
  }

  async function telecharger(doc) {
    const a = document.createElement("a");
    a.href = urlDe(await blobDe(doc));
    a.download = doc.name;
    document.body.append(a);
    a.click();
    a.remove();
  }

  async function ouvrir(doc) {
    // L'onglet est ouvert tout de suite (pendant le clic) pour éviter le bloqueur de fenêtres.
    const onglet = window.open("", "_blank");
    if (onglet) {
      onglet.document.title = doc.name;
      onglet.document.body.style.font = "16px system-ui, sans-serif";
      onglet.document.body.textContent = T.dechiffrement(doc.name);
    }
    try {
      const url = urlDe(await blobDe(doc));
      if (onglet) onglet.location.href = url;
      else await telecharger(doc);
    } catch (e) {
      if (onglet) onglet.close();
      throw e;
    }
  }

  function verrouiller() {
    cle = null; documents = []; majManifeste = ""; cache.clear();
    for (const u of urls) URL.revokeObjectURL(u);
    urls.clear();
    $("liste").replaceChildren();
    $("ecran-liste").hidden = true;
    $("ecran-verrou").hidden = false;
    $("mdp").value = "";
    message("");
    $("mdp").focus();
  }

  $("formulaire").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const mdp = $("mdp").value;
    if (!mdp) return;
    if (!window.crypto || !crypto.subtle) { message(T.navigateur, true); return; }
    $("ouvrir").disabled = true;
    message(T.verification);
    try {
      await deverrouiller(mdp);
      message("");
    } catch (e) {
      cle = null;
      if (e.name === "OperationError") message(T.mauvais, true);
      else if (e.status === 404) message(T.rien, true);
      else { console.error(e); message(T.chargement, true); }
      $("mdp").select();
    } finally {
      $("ouvrir").disabled = false;
    }
  });

  $("verrouiller").addEventListener("click", verrouiller);
  appliquerLangue();
})();
</script>
</body>
</html>
